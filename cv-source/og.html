<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Manrope;src:url("../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2") format("woff2");font-weight:200 800}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:Manrope;background:#F3F1EC;color:#1C2A2E;position:relative;overflow:hidden}
.bar{position:absolute;left:0;top:0;bottom:0;width:18px;background:#2E5E4E}
.wrap{position:absolute;inset:0 0 0 18px;display:grid;grid-template-columns:400px 1fr;align-items:center;padding:0 80px 0 70px;gap:60px}
.ph{width:330px;height:330px;border-radius:50%;border:5px solid #2E5E4E;padding:7px;background:#fff;box-shadow:0 30px 60px -30px rgba(28,42,46,.45)}
.ph img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.k{font-size:17px;font-weight:700;letter-spacing:.13em;white-space:nowrap;color:#2E5E4E;text-transform:uppercase}
h1{font-size:76px;line-height:.98;font-weight:800;letter-spacing:-.035em;margin-top:22px}
.url{margin-top:38px;font-size:24px;font-weight:600;color:#5A6866;display:flex;align-items:center;gap:12px}
.url:before{content:"";width:40px;height:2px;background:#2E5E4E}
svg{position:absolute;inset:0;opacity:.18}
</style></head><body>
<svg viewBox="0 0 1200 630" preserveAspectRatio="none"><g fill="none" stroke="#2E5E4E" stroke-width="1.2">
<path d="M0 520 C300 380 700 640 1200 430"/><path d="M0 545 C320 400 720 660 1200 455"/><path d="M0 570 C340 420 740 680 1200 480"/><path d="M0 120 C400 40 800 220 1200 90"/><path d="M0 95 C380 15 780 200 1200 65"/></g></svg>
<div class="bar"></div>
<div class="wrap"><div class="ph"><img src="../public/img/lautaro.jpg"></div>
<div><p class="k" id="k"></p><h1>Lautaro<br>Barrera Cisterna</h1><p class="url">lautarobc.com</p></div></div>
<script>document.getElementById('k').textContent = location.search.includes('en') ? 'F&B Manager · Operations, Cost Control & Technology' : 'F&B Manager · Operaciones, costes y tecnología'</script>
</body></html>
